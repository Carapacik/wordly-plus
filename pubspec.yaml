name: wordly
description: Guess the WORD in six tries
publish_to: none
version: 4.0.0+7
environment:
  sdk: ^3.13.0

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  material_ui: ^1.3.0
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  carapacik_lints: ^3.13.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.2
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/en.sqlite
    - assets/dictionary/ru.sqlite
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

flutter_gen:
  output: lib/src/ui_kit/generated
  line_length: 120

flutter_intl:
  enabled: true
  main_locale: en
  class_name: GeneratedLocalizations
  arb_dir: lib/src/localization/translations
  output_dir: lib/src/localization/generated

flutter_launcher_icons:
  image_path_android: "assets/images/icon-1024x1024.png"
  image_path_ios: "assets/images/icon-borderless-1024x1024.png"
  android: true
  ios: true
  adaptive_icon_background: "#F4F7FB"
  adaptive_icon_foreground: "assets/images/icon-foreground-1024x1024.png"
  min_sdk_android: 29
  web:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
    background_color: "#FFFFFF"
  macos:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
  windows:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
    icon_size: 256
